name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  role-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "bernstein==3.24.1" ./plugins/role-pack
      - name: Unit tests
        working-directory: plugins/role-pack
        run: python -m unittest discover -s tests -v
      - name: Demo
        run: bernstein-role-pack demo

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run local contract tests
        run: |
          for tests in plugins/*/tests/contract; do
            [ -d "$tests" ] || continue
            plugin="${tests%/tests/contract}"
            PYTHONPATH="$plugin/src" python -m unittest discover -s "$tests" -v
          done
