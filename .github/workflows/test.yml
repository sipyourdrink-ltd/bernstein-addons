name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  role-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "bernstein==3.24.1" ./plugins/role-pack
      - name: Unit tests
        working-directory: plugins/role-pack
        run: python -m unittest discover -s tests -v
      - name: Demo
        run: bernstein-role-pack demo

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run local contract tests
        run: |
          for tests in plugins/*/tests/contract; do
            [ -d "$tests" ] || continue
            plugin="${tests%/tests/contract}"
            PYTHONPATH="$plugin/src" python -m unittest discover -s "$tests" -v
          done
      - name: Check Sandcastle package installation
        run: |
          pip install --no-deps ./plugins/sandcastle
          bernstein-sandcastle --help
          runtime="$(python -c 'from bernstein_sandcastle.adapter import RUNTIME; print(RUNTIME)')"
          for file in runner.mjs package.json package-lock.json; do
            test -f "$runtime/$file"
          done
          cd "$runtime"
          npm ci --ignore-scripts
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { Output, run } from "bernstein-sandcastle-api";
          assert.equal(typeof run, "function");
          assert.deepEqual(Output.string({ tag: "result", maxRetries: 42 }), {
            _tag: "string", tag: "result", maxRetries: 42,
          });
          JS

  brand-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "bernstein==3.24.1" "brand-impersonation-detector==0.1.1" ./plugins/brand-gate
      - name: Unit tests with network blocked
        run: python -m unittest discover -s plugins/brand-gate/tests -v
      - name: Package and CLI
        run: |
          pip wheel --no-deps ./plugins/brand-gate --wheel-dir /tmp/brand-gate-wheel
          bernstein-brand-gate --help
