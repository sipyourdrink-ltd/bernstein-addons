[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bernstein-sandcastle"
version = "0.1.0"
description = "Records Sandcastle run evidence for Bernstein."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["bernstein", "sandcastle", "task-evidence"]

[project.scripts]
bernstein-sandcastle = "bernstein_sandcastle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bernstein_sandcastle = ["runtime/runner.mjs", "runtime/package.json", "runtime/package-lock.json"]
