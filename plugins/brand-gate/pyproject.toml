[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bernstein-brand-gate"
version = "0.1.0"
description = "Optional domain pre-action checks with Bernstein journal receipts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "bernstein>=3.24.1,<5",
    "brand-impersonation-detector>=0.1.1,<0.2",
    "filelock>=3.13,<5",
    "idna>=3,<4",
]

[project.entry-points."bernstein.plugins"]
brand_gate = "bernstein_brand_gate.plugin:BrandGatePlugin"

[project.scripts]
bernstein-brand-gate = "bernstein_brand_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
