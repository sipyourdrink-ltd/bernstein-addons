[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bernstein-role-pack"
version = "0.1.0"
description = "Role registry, receipt ledger and acceptance gate for Bernstein"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["bernstein>=3.24,<4"]

[project.entry-points."bernstein.plugins"]
role_pack = "bernstein_role_pack.plugin:RolePackPlugin"

[project.entry-points."bernstein.gates"]
role_pack_acceptance = "bernstein_role_pack.gate:RolePackAcceptanceGate"

[project.scripts]
bernstein-role-pack = "bernstein_role_pack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
